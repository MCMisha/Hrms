services:
  people-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrms_people
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - people-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms_people"]
      interval: 5s
      timeout: 5s
      retries: 10

  compensation-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrms_compensation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - compensation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrms_compensation"]
      interval: 5s
      timeout: 5s
      retries: 10

  compensation-service:
    build:
      context: .
      dockerfile: Hrms.CompensationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CompensationDB: Host=compensation-db;Port=5432;Database=hrms_compensation;Username=postgres;Password=postgres
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports:
      - "5281:8080"
    depends_on:
      compensation-db:
        condition: service_healthy

  people-service:
    build:
      context: .
      dockerfile: Hrms.PeopleService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PeopleDB: Host=people-db;Port=5432;Database=hrms_people;Username=postgres;Password=postgres
      GrpcServices__Compensation: http://compensation-service:8081
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5280:8080"
    depends_on:
      people-db:
        condition: service_healthy
      compensation-service:
        condition: service_started

volumes:
  people-db-data:
  compensation-db-data: