syntax = "proto3";

option csharp_namespace = "Hrms.GrpcContracts.Compensation";

package compensation;

import "google/protobuf/timestamp.proto";

service CompensationGrpc {
  rpc OpenCompensation (
      OpenCompensationRequest
      ) returns (
      OpenCompensationResponse
      );

  rpc CloseCurrentCompensation(
      CloseCurrentCompensationRequest
      ) returns (
      CloseCurrentCompensationResponse
      );
}

message OpenCompensationRequest {
  int32 employee_id = 1;
  int64 salary_in_grosz = 2;
  google.protobuf.Timestamp effective_from = 3;
}

message OpenCompensationResponse {
  int32 compensation_id = 1;
}

message CloseCurrentCompensationRequest {
  int32 employee_id = 1;
  google.protobuf.Timestamp effective_to = 2;
}

message CloseCurrentCompensationResponse {
  int32 compensation_id = 1;
}