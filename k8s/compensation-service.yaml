apiVersion: v1
kind: Service
metadata:
  name: compensation-service
  namespace: hrms
spec:
  selector:
    app: compensation-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compensation-service
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compensation-service
  template:
    metadata:
      labels:
        app: compensation-service
    spec:
      containers:
        - name: compensation-service
          image: hrms-compensation:v8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hrms-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-db-secret
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__CompensationDB
              value: "Host=compensation-db;Port=5432;Database=hrms_compensation;Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: Kestrel__Endpoints__Http__Url
              value: http://+:8080
            - name: Kestrel__Endpoints__Http__Protocols
              value: Http1
            - name: Kestrel__Endpoints__Grpc__Url
              value: http://+:8081
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: Http2
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5